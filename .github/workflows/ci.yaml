name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: go mod download
      # the ordinary repository gate, the same one a developer runs; see the Makefile
      - run: make test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: build stamped linux-amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          LDFLAGS=$(ci/ldflags.sh)
          go build -ldflags "${LDFLAGS}" -o push ./cmd/push
      - name: verify stamp
        run: |
          out=$(./push version)
          if [ -z "${out}" ] || printf '%s\n' "${out}" | grep -F '[developer build]'; then
            printf '%s\n' "${out}"
            exit 1
          fi
      - name: package artifact
        run: tar -czf push-linux-amd64.tar.gz push README.md CHANGELOG.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: push-linux-amd64
          path: push-linux-amd64.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: push-linux-amd64
      - name: name archive with ref tag
        run: mv push-linux-amd64.tar.gz "push-${{ github.ref_name }}-linux-amd64.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: push-${{ github.ref_name }}-linux-amd64.tar.gz
          fail_on_unmatched_files: true
          draft: true
